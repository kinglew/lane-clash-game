<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lane Rush</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    html, body, #game {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a120e;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <p id="status">boot</p>
  <script src="dist/game.js"></script>
</body>
</html>
